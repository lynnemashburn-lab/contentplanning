<title>Happily Ever Filmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Happily Ever Filmed: content call sheets for the Mashburn trip.
   Brand system borrowed from the Happily Ever Planned itinerary:
   Fraunces + Source Sans 3, navy neutrals, one colour per park. */

:root {
  color-scheme: light;
  --sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --bg: #EEF2F8;
  --surface: #FFFFFF;
  --surface-2: #F4F7FB;
  --line: #DAE2EE;
  --ink: #13213A;
  --ink-2: #465A76;
  --ink-3: #62748A;
  --accent: #1D6CC0;
  --on-accent: #FFFFFF;
  --rec: #D23F44;
  --on-rec: #FFFFFF;
  --good: #2C7A39;
  --warn: #975E0A;
  --on-park: #FFFFFF;
  --fill: rgba(151, 94, 10, .16);

  --mk: #1E6FBF;
  --ep: #0B7468;
  --hs: #975E0A;
  --ak: #2C7A39;
  --party: #6F3CC4;
  --travel: #566C88;
  --prep: #2A6E9B;
  --after: #C2413F;

  --scrim: rgba(12, 20, 34, .44);
  --shadow: 0 10px 30px rgba(19, 33, 58, .12);
  --shadow-sm: 0 1px 3px rgba(19, 33, 58, .08);
  --tab-h: 68px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1421;
    --surface: #16202F;
    --surface-2: #1C2738;
    --line: #283548;
    --ink: #E9EFF7;
    --ink-2: #A9BACE;
    --ink-3: #7F91A9;
    --accent: #58A6EE;
    --on-accent: #0D1421;
    --rec: #FF6F70;
    --on-rec: #0D1421;
    --good: #62B86E;
    --warn: #F2A63F;
    --on-park: #0D1421;
    --fill: rgba(242, 166, 63, .22);
    --mk: #4F9FE8;
    --ep: #35BCAC;
    --hs: #F2A63F;
    --ak: #62B86E;
    --party: #A77BEA;
    --travel: #8195AE;
    --prep: #7FB3D9;
    --after: #FF7A6E;
    --scrim: rgba(0, 0, 0, .56);
    --shadow: 0 10px 30px rgba(0, 0, 0, .42);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1421;
  --surface: #16202F;
  --surface-2: #1C2738;
  --line: #283548;
  --ink: #E9EFF7;
  --ink-2: #A9BACE;
  --ink-3: #7F91A9;
  --accent: #58A6EE;
  --on-accent: #0D1421;
  --rec: #FF6F70;
  --on-rec: #0D1421;
  --good: #62B86E;
  --warn: #F2A63F;
  --on-park: #0D1421;
  --fill: rgba(242, 166, 63, .22);
  --mk: #4F9FE8;
  --ep: #35BCAC;
  --hs: #F2A63F;
  --ak: #62B86E;
  --party: #A77BEA;
  --travel: #8195AE;
  --prep: #7FB3D9;
  --after: #FF7A6E;
  --scrim: rgba(0, 0, 0, .56);
  --shadow: 0 10px 30px rgba(0, 0, 0, .42);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3);
}

[data-park="mk"]     { --park: var(--mk);     --sky1: #0F3468; --sky2: #4E9FE0; }
[data-park="ep"]     { --park: var(--ep);     --sky1: #08333C; --sky2: #2FA99B; }
[data-park="hs"]     { --park: var(--hs);     --sky1: #40240F; --sky2: #D98A3A; }
[data-park="ak"]     { --park: var(--ak);     --sky1: #12301A; --sky2: #5FAE6B; }
[data-park="party"]  { --park: var(--party);  --sky1: #1F0E33; --sky2: #7B4BC4; }
[data-park="travel"] { --park: var(--travel); --sky1: #16283E; --sky2: #6E8AA8; }
[data-park="prep"]   { --park: var(--prep);   --sky1: #12384E; --sky2: #4A98BC; }
[data-park="after"]  { --park: var(--after);  --sky1: #3A1320; --sky2: #CF5659; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html.lock body { overflow: hidden; }

body {
  --park: var(--accent);
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--accent); }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

/* ---------- shell ---------- */
.app {
  max-width: 640px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px));
}

.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 10px; }
.brand { min-width: 0; }
.brand-name { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.brand-name em { font-style: italic; }
.brand-b { color: var(--rec); }
.brand-sub { margin-top: 3px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }

.sync {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 11px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync[data-state="synced"] .sync-dot { background: var(--good); }
.sync[data-state="saving"] .sync-dot { background: var(--accent); animation: blink 1.1s ease-in-out infinite; }
.sync[data-state="offline"] .sync-dot { background: var(--warn); }
@keyframes blink { 50% { opacity: .25; } }

.icon-btn {
  display: grid; place-items: center; flex: none;
  width: 44px; height: 44px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- the week rail (sticky, tubelight indicator) ---------- */
.rail {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex; gap: 4px;
  overflow-x: auto; scrollbar-width: none;
  margin-inline: -16px;
  padding: 6px 16px 7px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.rail::-webkit-scrollbar { display: none; }
body[data-tab="scripts"] .rail, body[data-tab="kit"] .rail { display: none; }

.glow {
  --gp: var(--accent);
  position: absolute; top: 0; left: 0;
  width: 26px; height: 3px; border-radius: 0 0 3px 3px;
  background: var(--gp);
  box-shadow: 0 0 10px 1px var(--gp), 0 2px 18px 2px color-mix(in srgb, var(--gp) 45%, transparent);
  transition: transform .38s cubic-bezier(.22, 1, .36, 1), background .3s ease;
  pointer-events: none;
}

.chip {
  position: relative; flex: 0 0 auto; min-width: 58px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 7px 6px 6px; border-radius: 12px;
  color: var(--ink-2);
  transition: background .2s ease;
}
.chip .glyph { width: 20px; height: 20px; color: var(--park); }
.chip-top { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.chip-bot { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); }
.chip-bar { width: 30px; height: 3px; margin-top: 4px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--park) 22%, transparent); }
.chip-bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--park); transition: width .45s cubic-bezier(.22, 1, .36, 1); }
.chip[aria-current="true"] { background: color-mix(in srgb, var(--park) 14%, transparent); }
.chip[aria-current="true"] .chip-top { color: var(--park); }
.chip.is-today .chip-top::after {
  content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 3px;
  border-radius: 50%; background: var(--rec); vertical-align: 2px;
}

/* ---------- day view ---------- */
.view { padding-top: 14px; }

.hero {
  position: relative; isolation: isolate; overflow: hidden;
  border-radius: 20px;
  padding: 18px 18px 16px;
  color: #fff;
  background: linear-gradient(158deg, var(--sky1), var(--sky2));
  box-shadow: var(--shadow);
}
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(6, 12, 22, .1), rgba(6, 12, 22, .34));
}
.hero-mark { position: absolute; right: -22px; bottom: -30px; z-index: -1; width: 172px; height: 172px; color: rgba(255, 255, 255, .14); }
.hero-mark svg { width: 100%; height: 100%; stroke-width: 1.1; }
.hero-eye { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .82); }
.hero-title { margin-top: 5px; font-family: var(--display); font-size: 29px; font-weight: 700; line-height: 1.08; text-wrap: balance; text-shadow: 0 1px 14px rgba(6, 12, 22, .35); }
.hero-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.fact {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255, 255, 255, .15); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .26);
  font-size: 13px; font-weight: 600;
}
.fact b { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .78); }
.hero-meter { margin-top: 16px; }
.hero-num { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, .92); }
.hero-num b { font-size: 20px; font-weight: 700; color: #fff; }
.meter { display: block; height: 6px; margin-top: 6px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .24); }
.meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: #fff; transition: width .55s cubic-bezier(.22, 1, .36, 1); }

.focus { margin: 14px 2px 0; font-size: 15.5px; color: var(--ink-2); max-width: 62ch; }

.hint {
  display: flex; gap: 10px; align-items: flex-start;
  margin-top: 14px; padding: 12px 8px 12px 14px;
  border-radius: 14px; font-size: 14.5px; color: var(--ink-2);
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
}
.hint b { color: var(--ink); }
.hint .icon-btn { width: 36px; height: 36px; border: 0; background: none; }

.next {
  display: flex; align-items: center; gap: 12px; width: 100%;
  margin-top: 14px; padding: 12px 12px 12px 14px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm);
}
.next-k { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--park); }
.next-t { flex: 1; min-width: 0; font-weight: 600; line-height: 1.3; }
.next svg { width: 18px; height: 18px; color: var(--ink-3); }
.next.is-clear .next-k { color: var(--good); }

.fbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 2px 16px; }
.fbar::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.fchip svg { width: 16px; height: 16px; }
.fchip .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.fchip[aria-pressed="true"] { background: var(--park); border-color: var(--park); color: var(--on-park); }
.fchip[aria-pressed="true"] .n { color: inherit; opacity: .85; }

/* ---------- timeline ---------- */
.timeline { position: relative; display: flex; flex-direction: column; gap: 20px; margin-top: 18px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; border-radius: 1px; background: var(--line); }

.mo { position: relative; padding-left: 26px; }
.mo::before {
  content: ""; position: absolute; left: 1px; top: 5px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--park);
  transition: background .25s ease;
}
.mo.is-done::before { background: var(--park); }
.mo.is-now::before { box-shadow: 0 0 0 5px color-mix(in srgb, var(--park) 26%, transparent); }
.mo-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
.mo-time { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--park); }
.mo-title { font-size: 17px; font-weight: 700; line-height: 1.25; }
.now { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--rec); color: var(--on-rec); }
.mo-count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.mo-allset { display: none; font-size: 14px; color: var(--ink-3); }
.hide-done .mo.is-done .mo-allset { display: block; }
.hide-done .mo.is-done .items { display: none; }

/* Each row carries a bottom rule and overlaps the next by 1px; the card clips the
   last one. Hidden rows (done or filtered) never leave a doubled or orphan rule. */
.items { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.it { display: flex; align-items: stretch; margin-bottom: -1px; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
.hide-done .it.is-done:not(.just) { display: none; }

.it-main, .it-open { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 12px; min-height: 58px; padding: 12px 14px; transition: background .15s ease; }
.it-open { padding-left: 12px; }
.it-main:active, .it-open:active, .it-tick:active { background: var(--surface-2); }
.it-tick { flex: none; display: flex; align-items: flex-start; padding: 12px 0 12px 14px; }

.tick {
  flex: none; display: grid; place-items: center;
  width: 26px; height: 26px; margin-top: 1px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--ink-3) 65%, transparent);
  transition: background .2s ease, border-color .2s ease;
}
.tick svg { width: 15px; height: 15px; color: var(--on-park); stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s ease-out; }
.is-done > * > .tick, .is-done > .tick, .is-done .it-tick .tick, .is-done .it-main .tick, .take.is-done .tick { background: var(--park); border-color: var(--park); }
.is-done .tick svg { stroke-dashoffset: 0; }
.just .tick { animation: pop .34s cubic-bezier(.22, 1, .36, 1); }
@keyframes pop { 0% { transform: scale(.78); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }

.it-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.it-kind { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.it-kind svg { width: 13px; height: 13px; }
.it-text {
  font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--ink);
  text-decoration-line: line-through; text-decoration-color: transparent; text-decoration-thickness: 1.5px;
  transition: color .2s ease, text-decoration-color .25s ease;
}
.it-note { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.is-done .it-text { color: var(--ink-3); text-decoration-color: currentColor; }
.is-done .it-note { color: var(--ink-3); }
.it-meta { flex: none; align-self: center; display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.it-meta svg { width: 18px; height: 18px; }
.it-go {
  flex: none; align-self: center; margin-right: 12px;
  height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--park); white-space: nowrap;
}
.it.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 35% { background: color-mix(in srgb, var(--park) 18%, transparent); } 100% { background: transparent; } }

.must { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--rec); }
.must::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rec); }
.slate { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--ink); color: var(--bg); }

.timeline[data-filter] .it { display: none; }
.timeline[data-filter="script"] .it[data-type="script"],
.timeline[data-filter="shot"] .it[data-type="shot"],
.timeline[data-filter="photo"] .it[data-type="photo"],
.timeline[data-filter="story"] .it[data-type="story"],
.timeline[data-filter="screen"] .it[data-type="screen"],
.timeline[data-filter="post"] .it[data-type="post"],
.timeline[data-filter="task"] .it[data-type="task"] { display: flex; }
.mo.is-filtered { display: none; }

/* ---------- scripts view ---------- */
.page-title { font-family: var(--display); font-size: 29px; font-weight: 700; line-height: 1.1; }
.page-sub { margin-top: 4px; font-size: 15px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.stat-l { font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.stat-v { margin-top: 2px; font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat-v small { font-size: 13px; font-weight: 600; color: var(--ink-3); }

.sfbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin: 12px -16px 0; padding: 8px 16px; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.sfbar .fbar { margin: 0 -16px; }
.sfbar .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.sv-day { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.sv-day .glyph { width: 16px; height: 16px; color: var(--park); }
.sc {
  display: block; width: 100%; margin-bottom: 10px; padding: 14px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
  transition: transform .15s ease;
}
.sc:active { transform: scale(.99); }
.sc-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.sc-status { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
.sc-status.is-posted { color: var(--good); }
.sc-title { display: block; margin-top: 8px; font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.22; text-wrap: balance; }
.sc-hook { display: block; margin-top: 6px; font-size: 15px; font-style: italic; color: var(--ink-2); }
.sc-foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--ink-3); }
.sc-meter { display: flex; gap: 3px; margin-left: auto; }
.sc-meter i { width: 18px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--park) 22%, transparent); }
.sc-meter i.on { background: var(--park); }
.empty { margin-top: 24px; padding: 18px; border-radius: 16px; border: 1px dashed var(--line); color: var(--ink-2); text-align: center; }

/* ---------- kit view ---------- */
.kit-sec { margin-top: 24px; }
.kit-h { margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.kit-note { margin: -2px 0 10px; font-size: 14px; color: var(--ink-2); }
.tips { border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }

  ref.onSnapshot(function (snap) {
    remoteExists = !!snap.exists;
    var body = snap.exists ? snap.data() : null;
    var items = body && body.items && typeof body.items === "object" ? body.items : {};
    if (mergeRemote(items)) { persist(); refreshAll(); }
    if (dirtyCount()) queueSync(800);
    else if (!inflight) setSync("synced");
  }, function (err) {
    if (err && (err.code === "revoked" || err.code === "not_granted")) { ref = null; setSync("local"); return; }
    setSync("offline");
    if (subTries++ < 3) setTimeout(subscribe, 30000);
  });
}
function initSync() {
  var c = window.claude;
  if (!c || typeof c.use !== "function") { setSync("local"); return; }
  c.use("db").then(function (db) {
    if (!db) { setSync("local"); return; }
    try { ref = db.doc("progress/lynne"); } catch (e) { ref = null; setSync("local"); return; }
    setSync("saving");
    subscribe();
  }, function () { setSync("local"); });
}
window.addEventListener("online", function () { if (ref && dirtyCount()) queueSync(400); });

/* =====================================================================
   PROGRESS
   ===================================================================== */

function takesDone(sid, list) { return list.filter(function (n) { return v("t:" + sid + ":" + n); }).length; }
function allTakes(sid) { return SMAP[sid].takes.map(function (_, i) { return i + 1; }); }
function scriptStatus(sid) {
  var stored = v("s:" + sid);
  var filmed = takesDone(sid, allTakes(sid)) === SMAP[sid].takes.length ? 1 : 0;
  return Math.max(stored, filmed);
}
function itemDone(it) {
  if (it.type === "script") return takesDone(it.ref, it.takes) === it.takes.length;
  if (it.type === "post") return scriptStatus(it.ref) >= 3;
  return !!v("i:" + it.id);
}
function dayItems(d) { return d.moments.reduce(function (a, m) { return a.concat(m.items); }, []); }
function dayProg(d) {
  var its = dayItems(d);
  return { done: its.filter(itemDone).length, total: its.length };
}
function itemLabel(it) {
  if (it.type === "script") { var s = SMAP[it.ref]; return "Film " + s.id.toUpperCase() + " · " + s.short + " (" + rangeLabel(it.takes, s.takes.length).toLowerCase() + ")"; }
  if (it.type === "post") return it.text || "Post “" + SMAP[it.ref].short + "”";
  return it.text;
}
function nowMoment(d) {
  if (d.date !== todayISO()) return -1;
  var n = new Date(), mins = n.getHours() * 60 + n.getMinutes(), idx = -1;
  d.moments.forEach(function (m, i) {
    if (!m.at) return;
    var p = m.at.split(":");
    if (Number(p[0]) * 60 + Number(p[1]) <= mins) idx = i;
  });
  return idx;
}
function nextUp(d) {
  var start = Math.max(0, nowMoment(d));
  for (var j = 0; j < d.moments.length; j++) {
    var m = d.moments[(start + j) % d.moments.length];
    for (var k = 0; k < m.items.length; k++) if (!itemDone(m.items[k])) return m.items[k];
  }
  return null;
}

function refresh() {
  var d = DMAP[UI.day];
  $$("#view-days [data-item]").forEach(function (li) {
    var it = ITEM[li.dataset.item], done = itemDone(it);
    li.classList.toggle("is-done", done);
    var b = li.querySelector("[aria-pressed]");
    if (b) b.setAttribute("aria-pressed", String(done));
    if (it.type === "script") {
      var c = li.querySelector("[data-tc]");
      if (c) c.textContent = takesDone(it.ref, it.takes) + "/" + it.takes.length;
    }
  });
  var tl = $("#timeline");
  $$("#view-days .mo").forEach(function (mo) {
    var m = d.moments[Number(mo.dataset.mo)];
    var done = m.items.filter(itemDone).length;
    mo.classList.toggle("is-done", done === m.items.length);
    mo.querySelector(".mo-count").textContent = done + "/" + m.items.length;
    var f = tl && tl.dataset.filter;
    mo.classList.toggle("is-filtered", !!f && !m.items.some(function (it) { return it.type === f; }));
  });
  var p = dayProg(d), pct = p.total ? Math.round(p.done / p.total * 100) : 0;
  if ($("#day-num")) {
    $("#day-num").innerHTML = "<b>" + p.done + "</b> of " + p.total + " done";
    $("#day-pct").textContent = pct + "%";
    $("#day-bar").style.width = pct + "%";
  }
  $$("#view-days [data-count]").forEach(function (el) {
    var t = el.dataset.count, list = dayItems(d).filter(function (it) { return it.type === t; });
    el.textContent = list.filter(itemDone).length + "/" + list.length;
  });
  var nx = $("#next");
  if (nx) {
    var it = nextUp(d);
    nx.classList.toggle("is-clear", !it);
    nx.disabled = !it;
    nx.innerHTML = it
      ? '<span class="next-k">Next up</span><span class="next-t">' + esc(itemLabel(it)) + "</span>" + I.chev
      : '<span class="next-k">All clear</span><span class="next-t">Every box is checked for ' + esc(d.nm) + ".</span>";
    nx.dataset.target = it ? it.id : "";
  }
  $$("#rail .chip").forEach(function (chip) {
    var dd = DMAP[chip.dataset.day], pp = dayProg(dd);
    chip.querySelector(".chip-bar i").style.width = (pp.total ? pp.done / pp.total * 100 : 0) + "%";
    chip.setAttribute("aria-label", dd.eyebrow + ", " + dd.title + ", " + pp.done + " of " + pp.total + " done");
  });
}

var sheetFor = null, sheetFocus = [], sheetOpener = null, lastNow = "";

  sh.hidden = false; sc.hidden = false;
  void sh.offsetHeight;
  sh.classList.add("is-open"); sc.classList.add("is-open");
  $("#app").inert = true;
  document.documentElement.classList.add("lock");
  setTimeout(function () {
    var t = $("#sh-title"); if (t) t.focus({ preventScroll: true });
    var fl = $(".take.is-focus", sh); if (fl) fl.scrollIntoView({ block: "center" });
  }, 80);
}

        var lab = ["Take " + n, t.k === "hook" ? "Hook" : t.k === "cta" ? "Call to action" : "", mmss(tmg[i][0]) + "–" + mmss(tmg[i][1])].filter(Boolean).join(" · ");
        return '<li class="take' + (done ? " is-done" : "") + (sheetFocus.indexOf(n) > -1 ? " is-focus" : "") + '" data-n="' + n + '">' +
          '<button type="button" class="take-btn" data-act="take" data-n="' + n + '" aria-pressed="' + !!done + '"><span class="tick">' + I.check + "</span>" +
          '<span class="take-body"><span class="take-label">' + lab + "</span>" + (t.w ? '<span class="take-when">' + esc(t.w) + "</span>" : "") +
          '<span class="take-say">' + fill(t.say) + "</span></span></button></li>";
      }).join("") + "</ol>" +
      '<h3 class="sh-h">On-screen text</h3>' +
      '<div class="copybox"><p class="copy-text" id="cp-hook">' + fill(s.hook) + '</p><button type="button" class="copy-btn" data-act="copy" data-copy="hook:' + s.id + '" data-el="cp-hook">' + I.copy + "Copy text</button></div>" +
      '<h3 class="sh-h">Caption</h3>' +
      '<div class="copybox"><p class="copy-text" id="cp-cap">' + fill(s.caption) + '</p><button type="button" class="copy-btn" data-act="copy" data-copy="cap:' + s.id + '" data-el="cp-cap">' + I.copy + "Copy caption</button></div>" +
      '<h3 class="sh-h">B-roll to grab</h3>' +
      '<ul class="broll">' + s.broll.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul>" +
      '<h3 class="sh-h">When to post</h3>' +
      '<p class="sh-post">' + esc(s.post) + "</p>" +
    "</div>" +
    '<footer class="sh-foot">' +
      '<button type="button" class="btn" data-act="copy" data-copy="cap:' + s.id + '" data-el="cp-cap">' + I.copy + "Caption</button>" +
      '<button type="button" class="btn btn-primary" data-act="tm">' + I.play + "Take mode</button>" +
    "</footer>";
  patchSheet();
}
function patchSheet() {
  if (!sheetFor) return;
  var s = SMAP[sheetFor], x = scriptStatus(s.id), sh = $("#sheet");
  $$(".take", sh).forEach(function (li) {
    var done = !!v("t:" + s.id + ":" + li.dataset.n);
    li.classList.toggle("is-done", done);
    li.querySelector(".take-btn").setAttribute("aria-pressed", String(done));
  });
  $$(".step", sh).forEach(function (b, i) {
    b.classList.toggle("is-on", x >= i);
    b.setAttribute("aria-checked", String(x === i));
  });
  var c = $("#sh-count");
  if (c) c.textContent = takesDone(s.id, allTakes(s.id)) + "/" + s.takes.length + " recorded";
}

/* drag the sheet down to close it */
(function () {
  var sh = $("#sheet"), drag = null;
  sh.addEventListener("pointerdown", function (e) {
    if (!e.target.closest("[data-drag]") || e.target.closest("button")) return;
    drag = { y: e.clientY, t: Date.now(), dy: 0, id: e.pointerId };
    sh.classList.add("is-dragging");
    try { sh.setPointerCapture(e.pointerId); } catch (err) {}
  });
  sh.addEventListener("pointermove", function (e) {
    if (!drag) return;
    drag.dy = Math.max(0, e.clientY - drag.y);
    sh.style.transform = "translateY(" + drag.dy + "px)";
  });
  var end = function () {
    if (!drag) return;
    var speed = drag.dy / Math.max(1, Date.now() - drag.t);
    sh.classList.remove("is-dragging");
    if (drag.dy > 110 || (drag.dy > 30 && speed > .6)) closeSheet();
    else sh.style.transform = "";
    drag = null;
  };
  sh.addEventListener("pointerup", end);
  sh.addEventListener("pointercancel", end);
})();

/* =====================================================================
   TAKE MODE: one take at a time, big type, screen stays awake
   ===================================================================== */

var tm = null, wake = null;
function lockWake() {
  try {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request("screen").then(function (w) { wake = w; }, function () { wake = null; });
    }
  } catch (e) { wake = null; }
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
function openTM() {
  var s = SMAP[sheetFor];
  var firstFocus = sheetFocus.filter(function (n) { return !v("t:" + s.id + ":" + n); })[0];
  var firstOpen = allTakes(s.id).filter(function (n) { return !v("t:" + s.id + ":" + n); })[0];
  tm = { sid: s.id, i: (firstFocus || firstOpen || 1) - 1, end: false, dir: "" };
  var el = $("#tm");
  el.dataset.park = DMAP[s.day].park;
  el.hidden = false;
  $("#sheet").inert = true;
  renderTM();
  lockWake();
  var c = $("#tm-close"); if (c) c.focus({ preventScroll: true });
}
function closeTM() {
  $("#tm").hidden = true;
  $("#sheet").inert = false;
  releaseWake();
  tm = null;
  patchSheet();
  refresh();
  var b = $('#sheet [data-act="tm"]'); if (b) b.focus({ preventScroll: true });
}
function renderTM() {
  var s = SMAP[tm.sid], el = $("#tm"), tmg = timing(s), total = s.takes.length;
  var head = '<header class="tm-head"><p class="tm-slate"><span class="slate">' + s.id.toUpperCase() + "</span>" +
    (tm.end ? "That’s a wrap" : "Take " + (tm.i + 1) + " of " + total) + "</p>" +
    '<button type="button" class="icon-btn" id="tm-close" data-act="tm-close" aria-label="Close take mode">' + I.x + "</button></header>" +
    '<p class="tm-name" id="tm-title">' + esc(s.short) + "</p>";
  var dots = '<div class="tm-dots" aria-hidden="true">' + s.takes.map(function (_, i) {
    return '<span class="' + (v("t:" + s.id + ":" + (i + 1)) ? "on" : "") + (!tm.end && i === tm.i ? " cur" : "") + '"></span>';
  }).join("") + "</div>";
  if (tm.end) {
    var got = takesDone(s.id, allTakes(s.id));
    el.innerHTML = head +
      '<div class="tm-stage"><article class="tm-card slide-l"><p class="tm-role">' + got + " of " + total + " takes recorded</p>" +
      '<p class="tm-say">' + (got === total ? "All of " + s.id.toUpperCase() + " is in the can." : "Almost there. The skipped takes are still open in the script.") + "</p>" +
      '<p class="tm-when">' + (got === total ? "It’s marked Filmed. Edit it tonight or at rest time." : "Tap Start over to record them now.") + "</p></article></div>" +
      dots +
      '<footer class="tm-foot two"><button type="button" class="btn" data-act="tm-restart">Start over</button><button type="button" class="btn btn-primary" data-act="tm-close">' + I.check + "Done</button></footer>";
    return;
  }
  var t = s.takes[tm.i], n = tm.i + 1, done = !!v("t:" + s.id + ":" + n);
  var role = [t.k === "hook" ? "Hook" : t.k === "cta" ? "Call to action" : "Take " + n, mmss(tmg[tm.i][0]) + "–" + mmss(tmg[tm.i][1])].join(" · ");
  el.innerHTML = head +
    '<div class="tm-stage" id="tm-stage"><article class="tm-card' + (tm.dir ? " slide-" + tm.dir : "") + '">' +
      '<p class="tm-role">' + role + "</p>" +
      '<p class="tm-say">' + fill(t.say) + "</p>" +
      (t.w ? '<p class="tm-when">' + esc(t.w) + "</p>" : "") +
      (done ? '<p class="tm-got">' + I.check + "Recorded</p>" : "") +
    "</article></div>" +
    dots +
    '<footer class="tm-foot">' +
      '<button type="button" class="btn" data-act="tm-prev"' + (tm.i === 0 ? " disabled" : "") + ">" + I.back + "Back</button>" +
      '<button type="button" class="btn btn-primary" data-act="tm-done">' + I.check + (done ? "Next" : "Got it") + "</button>" +
      '<button type="button" class="btn" data-act="tm-next">Skip' + I.chev + "</button>" +
    "</footer>";
}
function tmMove(step) {
  var total = SMAP[tm.sid].takes.length;
  if (step > 0 && tm.i >= total - 1) { tm.end = true; tm.dir = "l"; renderTM(); return; }
  tm.i = Math.max(0, Math.min(total - 1, tm.i + step));
  tm.dir = step > 0 ? "l" : "r";
  renderTM();
}
function tmDone() {
  var k = "t:" + tm.sid + ":" + (tm.i + 1);
  if (!v(k)) { put(k, 1); buzz(); }
  tmMove(1);
}
(function () {
  var start = null;
  $("#tm").addEventListener("pointerdown", function (e) {
    if (!e.target.closest(".tm-stage") || !tm || tm.end) return;
    start = { x: e.clientX, y: e.clientY };
  });
  $("#tm").addEventListener("pointerup", function (e) {
    if (!start || !tm) return;
    var dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) tmMove(dx < 0 ? 1 : -1);
  });
  $("#tm").addEventListener("pointercancel", function () { start = null; });
})();

/* =====================================================================
   ACTIONS
   ===================================================================== */

function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
var toastTimer = 0;
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("is-on"); }, 2400);
}

function withCelebration(fn, li) {
  var d = DMAP[UI.day], before = dayProg(d);
  var turnedOn = fn();
  if (li && turnedOn) {
    li.classList.add("just");
    setTimeout(function () { li.classList.remove("just"); }, 900);
  }
  if (turnedOn) buzz();
  refresh();
  var after = dayProg(d);
  if (after.total && after.done === after.total && before.done < before.total) {
    toast("Every box checked for " + d.nm + ".");
    if (!reduced) confetti();
  }
}
function toggleItem(id, btn) {
  withCelebration(function () { var k = "i:" + id, nv = v(k) ? 0 : 1; put(k, nv); return !!nv; }, btn.closest(".it"));
}
function toggleTakes(id, btn) {
  var it = ITEM[id];
  withCelebration(function () {
    var all = takesDone(it.ref, it.takes) === it.takes.length;
    it.takes.forEach(function (n) { put("t:" + it.ref + ":" + n, all ? 0 : 1); });
    return !all;
  }, btn.closest(".it"));
}
function togglePost(id, btn) {
  var it = ITEM[id];
  withCelebration(function () {
    var posted = scriptStatus(it.ref) >= 3;
    put("s:" + it.ref, posted ? 2 : 3);
    return !posted;
  }, btn.closest(".it"));
}
function toggleTake(n) {
  var sid = sheetFor, k = "t:" + sid + ":" + n, li = $('.take[data-n="' + n + '"]', $("#sheet"));
  withCelebration(function () { var nv = v(k) ? 0 : 1; put(k, nv); return !!nv; }, li);
  patchSheet();
}
function setStatus(val) {
  var sid = sheetFor;
  if (val === 0 && takesDone(sid, allTakes(sid)) === SMAP[sid].takes.length) {
    toast("Uncheck a take to move this back to To film.");
    return;
  }
  withCelebration(function () { put("s:" + sid, val); return false; });
  patchSheet();
}

function copySource(key) {
  var p = key.split(":");
  if (p[0] === "cap") return curly(SMAP[p[1]].caption);
  if (p[0] === "hook") return curly(SMAP[p[1]].hook);
  if (p[0] === "kit") return curly(KIT_COPY[Number(p[1])] || "");
  return "";
}
function copy(key, btn) {
  var text = copySource(key);
  var elId = btn.dataset.el;
  var fallback = function () {
    var el = elId && document.getElementById(elId);
    if (el) {
      try {
        var r = document.createRange(); r.selectNodeContents(el);
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      } catch (e) {}
    }
    toast("Text selected. Use your phone’s Copy.");
  };
  try {
    navigator.clipboard.writeText(text).then(function () { toast(key.indexOf("cap:") === 0 ? "Caption copied" : "Copied"); }, fallback);
  } catch (e) { fallback(); }
}

function selectDay(id) {
  if (!DMAP[id]) return;
  UI.day = id; UI.filter = null; saveUI();
  $$("#rail .chip").forEach(function (c) { c.setAttribute("aria-current", String(c.dataset.day === id)); });
  if (UI.tab !== "days") setTab("days");
  else renderDay();
  placeGlow();
  window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
}
var TABS = ["days", "scripts", "kit"];
function setTab(tab) {
  if (TABS.indexOf(tab) < 0) tab = "days";
  UI.tab = tab; saveUI();
  document.body.dataset.tab = tab;
  TABS.forEach(function (t) {
    $("#view-" + t).hidden = t !== tab;
    $("#tab-" + t).setAttribute("aria-current", t === tab ? "page" : "false");
  });
  $("#tab-pill").style.setProperty("--i", TABS.indexOf(tab));
  if (tab === "days") { renderDay(); placeGlow(); }
  if (tab === "scripts") renderScripts();
  if (tab === "kit") renderKit();
  window.scrollTo(0, 0);
}
function goNext() {
  var id = $("#next").dataset.target;
  if (!id) return;
  if (UI.filter) { UI.filter = null; saveUI(); renderDay(); }
  var li = $('#view-days [data-item="' + id + '"]');
  if (!li) return;
  li.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash");
}
function applyTheme() {
  var t = UI.theme || "auto", root = document.documentElement;
  if (t === "auto") { if (hostTheme) root.setAttribute("data-theme", hostTheme); else root.removeAttribute("data-theme"); }
  else root.setAttribute("data-theme", t);
  $$('[data-act="theme-set"]').forEach(function (b) { b.setAttribute("aria-checked", String(b.dataset.v === t)); });
}
var hostTheme = document.documentElement.getAttribute("data-theme");
var resetArmed = 0;
function reset(btn) {
  if (Date.now() - resetArmed > 4000) {
    resetArmed = Date.now();
    btn.classList.add("is-armed");
    btn.textContent = "Tap again to clear everything";
    setTimeout(function () { if (btn.isConnected && Date.now() - resetArmed >= 4000) { btn.classList.remove("is-armed"); btn.textContent = "Clear all checkmarks"; } }, 4100);
    return;
  }
  resetArmed = 0;
  var now = Date.now();
  Object.keys(S).forEach(function (k) { S[k] = [0, now]; dirty[k] = 1; });
  persist(); queueSync(300);
  refresh(); renderKit();
  toast("All checkmarks cleared.");
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  var a = b.dataset.act;
  if (a === "tab") setTab(b.dataset.tab);
  else if (a === "day") selectDay(b.dataset.day);
  else if (a === "toggle") toggleItem(b.dataset.id, b);
  else if (a === "takes") toggleTakes(b.dataset.id, b);
  else if (a === "post") togglePost(b.dataset.id, b);
  else if (a === "open") { var it = ITEM[b.dataset.id]; openSheet(b.dataset.script, it && it.type === "script" ? it.takes : [], b); }
  else if (a === "close") closeSheet();
  else if (a === "take") toggleTake(Number(b.dataset.n));
  else if (a === "status") setStatus(Number(b.dataset.v));
  else if (a === "copy") copy(b.dataset.copy, b);
  else if (a === "tm") openTM();
  else if (a === "tm-close") closeTM();
  else if (a === "tm-prev") tmMove(-1);
  else if (a === "tm-next") tmMove(1);
  else if (a === "tm-done") tmDone();
  else if (a === "tm-restart") { tm.i = 0; tm.end = false; tm.dir = "r"; renderTM(); }
  else if (a === "hide") { UI.hideDone = !UI.hideDone; saveUI(); $("#view-days").classList.toggle("hide-done", UI.hideDone); b.setAttribute("aria-pressed", String(UI.hideDone)); }
  else if (a === "filter") {
    UI.filter = UI.filter === b.dataset.type ? null : b.dataset.type; saveUI();
    var tl = $("#timeline");
    if (UI.filter) tl.dataset.filter = UI.filter; else delete tl.dataset.filter;
    $$('#view-days [data-act="filter"]').forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.type === UI.filter)); });
    refresh();
  }
  else if (a === "next") goNext();
  else if (a === "hint") { UI.hint = 1; saveUI(); var h = $("#hint"); if (h) h.remove(); }
  else if (a === "sf") { UI.sf = b.dataset.f; saveUI(); renderScripts(); }
  else if (a === "theme-set") { UI.theme = b.dataset.v; saveUI(); applyTheme(); }
  else if (a === "reset") reset(b);
});
document.addEventListener("keydown", function (e) {
  if (tm && !$("#tm").hidden) {
    if (e.key === "Escape") closeTM();
    else if (e.key === "ArrowRight") tmMove(1);
    else if (e.key === "ArrowLeft") tmMove(-1);
    return;
  }
  if (e.key === "Escape" && sheetFor) closeSheet();
});
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState !== "visible") return;
  if (tm && !$("#tm").hidden) lockWake();
  if (ref && dirtyCount()) queueSync(400);
  tick();
});

/* =====================================================================
   CONFETTI (only when a whole day is checked off)
   ===================================================================== */

function confetti() {
  var c = $("#confetti"), ctx = c.getContext && c.getContext("2d");
  if (!ctx) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr; c.hidden = false;
  var cs = getComputedStyle(document.documentElement);
  var cols = ["--mk", "--ep", "--hs", "--ak", "--party", "--rec"].map(function (k) { return cs.getPropertyValue(k).trim() || "#1D6CC0"; });
  var P = [];
  for (var i = 0; i < 90; i++) {
    P.push({ x: W / 2 + (Math.random() - .5) * 90, y: H * .38, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3, r: Math.random() * 6 + 5, a: Math.random() * 6.28, va: (Math.random() - .5) * .3, c: cols[i % cols.length] });
  }
  var t0 = performance.now();
  (function frame(t) {
    var el = t - t0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    P.forEach(function (p) {
      p.vy += .26; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.globalAlpha = Math.max(0, 1 - el / 1700);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      ctx.restore();
    });
    if (el < 1700) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(t0);
}

/* =====================================================================
   START
   ===================================================================== */

function tick() {
  var today = todayISO();
  if (UI.lastDate !== today) {
    UI.lastDate = today; UI.day = defaultDay(today); saveUI();
    renderRail();
    if (UI.tab === "days") renderDay();
    placeGlow();
    return;
  }
  if (UI.tab === "days") {
    var d = DMAP[UI.day];
    if (d.id + ":" + nowMoment(d) !== lastNow) renderDay();
  }
}

$("#tab-days").innerHTML = I.days + "<span>Days</span>";
$("#tab-scripts").innerHTML = I.script + "<span>Scripts</span>";
$("#tab-kit").innerHTML = I.kit + "<span>Kit</span>";

var today = todayISO();
if (UI.lastDate !== today || !DMAP[UI.day]) { UI.day = defaultDay(today); UI.lastDate = today; }
var hash = (location.hash || "").slice(1);
if (DMAP[hash]) { UI.day = hash; UI.tab = "days"; }
else if (TABS.indexOf(hash) > -1) UI.tab = hash;
saveUI();

applyTheme();
renderRail();
setTab(UI.tab || "days");
if (SMAP[hash]) openSheet(hash, []);
initSync();
setInterval(tick, 60000);
window.addEventListener("resize", function () { placeGlow(false); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeGlow(false); });
})();
</script>
